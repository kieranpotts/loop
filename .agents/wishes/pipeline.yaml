wish: "1"
name: pipeline

limits:
  max_turns: 10
  timeout: 30s

state:
  path: .loop/runs/{{ run.id }}/state.yaml

steps:
  greet:
    type: script
    run: echo '{"message":"hello from a wish"}'
    outputs:
      message: { type: string }

  print:
    needs: [greet]
    type: script
    run: 'echo "greet said: {{ steps.greet.outputs.message }}"'
